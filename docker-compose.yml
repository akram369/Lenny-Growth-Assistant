version: '3.8'

services:
  # 1. PostgreSQL with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny-growth-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lenny_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Ollama local LLM runtime (mandatory for local evaluation demo)
  ollama:
    image: ollama/ollama:latest
    container_name: lenny-growth-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # 3. FastAPI application backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lenny-growth-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/lenny_assistant
      - DEFAULT_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  # 4. React frontend with sandboxed artifact viewer
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lenny-growth-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama_models:
